name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vet, Test (-race) & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Vet
        run: go vet ./...

      - name: Unit Tests with Race Detector & Coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -n 1

      - name: On-Device ML 0-Alloc Benchmarks
        run: go test -bench=. -benchmem -benchtime=50ms ./internal/rfml/...

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf-heatmap-coverage
          path: coverage.out
          retention-days: 14

  build:
    name: Build ARM64 .deb Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ARM64 Debian Package
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh
          (cd dist && sha256sum *.deb > SHA256SUMS)
          ls -lh dist/

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rf-heatmap-arm64-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb Artifact
        uses: actions/download-artifact@v4
        with:
          name: rf-heatmap-arm64-deb
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RF Heatmap ${GITHUB_REF_NAME}" \
            --generate-notes
